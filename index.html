
<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOCBIZHUB – Slanje poslovnih ponuda</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

.container {
  max-width: 850px;
  margin: 35px auto;
  background: white;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  color: #123c69;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  margin-bottom: 30px;
}

h2 { color: #123c69; }

label {
  display: block;
  margin-top: 17px;
  margin-bottom: 7px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 220px;
  resize: vertical;
  line-height: 1.5;
}

button {
  border: none;
  padding: 13px 20px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
}

.primary {
  background: #123c69;
  color: white;
  width: 100%;
  margin-top: 20px;
}

.primary:hover { background: #1d568e; }

.secondary {
  background: #e2e8f0;
  color: #1e293b;
  margin-top: 12px;
}

.logout {
  background: #dc2626;
  color: white;
}

.message {
  padding: 12px;
  margin-top: 15px;
  border-radius: 7px;
  display: none;
  white-space: pre-wrap;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.hidden { display: none !important; }

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.note {
  background: #eff6ff;
  padding: 14px;
  border-radius: 7px;
  color: #1e40af;
  line-height: 1.5;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">DOCBIZHUB</div>
  <div class="subtitle">Upravljanje i slanje poslovnih ponuda</div>

  <section id="loginPanel">

    <h2>Prijava na sistem</h2>

    <form id="loginForm">

      <label for="email">Email adresa</label>
      <input
        type="email"
        id="email"
        autocomplete="username"
        required
      >

      <label for="password">Lozinka</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button type="submit" class="primary" id="loginButton">
        Prijavi se
      </button>

    </form>

    <button type="button" class="secondary" id="resetButton">
      Zaboravljena lozinka?
    </button>

    <div id="loginMessage" class="message"></div>

  </section>

  <section id="adminPanel" class="hidden">

    <div class="topbar">
      <div>
        <h2>Slanje poslovnih ponuda</h2>
        <div id="userInfo"></div>
      </div>

      <button type="button" class="logout" id="logoutButton">
        Odjava
      </button>
    </div>

    <form id="offerForm">

      <label for="primalac">Email adresa primaoca</label>
      <input
        type="email"
        id="primalac"
        placeholder="firma@example.com"
        required
      >

      <label for="posiljalac">Naziv pošiljaoca</label>
      <input
        type="text"
        id="posiljalac"
        value="DOCBIZHUB"
        required
      >

      <label for="subject">Naslov emaila</label>
      <input
        type="text"
        id="subject"
        placeholder="Poslovna ponuda za saradnju"
        required
      >

      <label for="tekst">Tekst poslovne ponude</label>
      <textarea
        id="tekst"
        placeholder="Ovdje ručno unesite tekst svoje poslovne ponude..."
        required
      ></textarea>

      <button type="button" class="secondary" id="previewButton">
        Pregled ponude
      </button>

      <button type="submit" class="primary" id="sendButton">
        Pošalji poslovnu ponudu
      </button>

    </form>

    <div id="status" class="message"></div>

    <div class="note">
      Ponude se unose ručno. Sistem ne generiše tekst pomoću umjetne
      inteligencije. Prije slanja provjerite email adresu primaoca,
      naslov i sadržaj poruke.
    </div>

  </section>

</div>

<script>
"use strict";

// ==================================================
// SUPABASE KONFIGURACIJA
// ==================================================

const SUPABASE_URL =
  "https://uduwpvdjmanrgpumdrfh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_IfX6dxz-ILfYK_3VgelcMw_tYOX0y45";

// ==================================================
// POSTAVKE EMAIL SISTEMA
// ==================================================

// OVDJE UPIŠI TAČAN NAZIV POSTOJEĆE EDGE FUNCTION
const FUNCTION_NAME = "UNESI_NAZIV_EDGE_FUNCTION";

// OVDJE UPIŠI VERIFIKOVANU DOMENU POŠILJAOCA
const SENDER_DOMAIN = "UNESI_SVOJU_DOMENU.BA";

// ==================================================
// PROVJERA I KREIRANJE SUPABASE KLIJENTA
// ==================================================

if (!window.supabase || !window.supabase.createClient) {
  document.body.innerHTML =
    "<h2>Greška: Supabase biblioteka nije učitana. Osvježite stranicu.</h2>";

  throw new Error("Supabase biblioteka nije učitana.");
}

if (
  !SUPABASE_PUBLISHABLE_KEY ||
  !SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_")
) {
  throw new Error("Supabase Publishable API ključ nije ispravno postavljen.");
}

// KREIRA SE SAMO JEDAN SUPABASE KLIJENT

// ==================================================
// DIJAGNOSTIKA SUPABASE ZAHTJEVA
// ==================================================

const originalFetch = window.fetch.bind(window);

async function diagnosticFetch(input, init) {

  const request = new Request(input, init);
  const url = new URL(request.url);

  // Pratimo samo zahtjeve prema našem Supabase projektu
  const isSupabase = url.hostname.endsWith(".supabase.co");

  if (!isSupabase) {
    return originalFetch(request);
  }

  const apikeyPresent = request.headers.has("apikey");
  const authorizationPresent = request.headers.has("authorization");

  console.group("SUPABASE DIJAGNOSTIKA");

  console.log("URL:", url.origin + url.pathname);
  console.log("Metoda:", request.method);
  console.log("API KEY zaglavlje:", apikeyPresent ? "POSTOJI" : "NEDOSTAJE");
  console.log("Authorization zaglavlje:", authorizationPresent ? "POSTOJI" : "NEDOSTAJE");

  let response;

  try {

    response = await originalFetch(request);

    console.log("HTTP STATUS:", response.status);
    console.log("Zahtjev uspješan:", response.ok);

    if (!response.ok) {
      const errorText = await response.clone().text();
      console.error("ODGOVOR SERVERA:", errorText);
    }

    console.groupEnd();

    return response;

  } catch (error) {

    console.error("FETCH GREŠKA:", error);
    console.groupEnd();

    throw error;
  }
}

// ==================================================
// KREIRANJE SUPABASE KLIJENTA
// ==================================================

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    global: {
      fetch: diagnosticFetch
    },
    auth: {
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: true
    }
  }
);

console.log("DOCBIZHUB: Dijagnostika je aktivna.");

 console.log("Supabase biblioteka:", !!window.supabase);
console.log("Supabase klijent:", !!supabase);
console.log("Publishable API ključ postavljen:", !!SUPABASE_PUBLISHABLE_KEY);

// ==================================================
// HTML ELEMENTI
// ==================================================

const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");

const loginForm = document.getElementById("loginForm");
const offerForm = document.getElementById("offerForm");

const loginButton = document.getElementById("loginButton");
const sendButton = document.getElementById("sendButton");

const loginMessage = document.getElementById("loginMessage");
const status = document.getElementById("status");

const senderInput = document.getElementById("posiljalac");

// ==================================================
// PRIKAZ PORUKA
// ==================================================

function showError(element, message) {
  element.textContent = message;
  element.className = "message error";
}

function showSuccess(element, message) {
  element.textContent = message;
  element.className = "message success";
}

function clearMessage(element) {
  element.textContent = "";
  element.className = "message";
}

// ==================================================
// PRIKAZ PANELA
// ==================================================

function showLogin() {
  loginPanel.classList.remove("hidden");
  adminPanel.classList.add("hidden");
}

function showAdmin(user) {
  loginPanel.classList.add("hidden");
  adminPanel.classList.remove("hidden");

  document.getElementById("userInfo").textContent =
    "Prijavljeni korisnik: " + (user.email || "");
}

// ==================================================
// AŽURIRANJE STATUSA KORISNIKA
// ==================================================

async function updateUserStatus(user, online) {

  if (!user || !user.id) return;

  try {

    const { error } = await supabase
      .from("POSAO_KORISNICI")
      .update({
        IS_ONLINE: online,
        LAST_SEEN: new Date().toLocaleDateString()
      })
      .eq("USER", user.id);

    if (error) {
      console.warn(
        "Status korisnika nije ažuriran:",
        error.message
      );
    }

  } catch (error) {
    console.warn("Greška pri ažuriranju statusa:", error);
  }
}

// ==================================================
// PRIJAVA
// ==================================================

loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  clearMessage(loginMessage);

  loginButton.disabled = true;
  loginButton.textContent = "Prijava u toku...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {

    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    await updateUserStatus(data.user, true);

    showAdmin(data.user);

    showSuccess(status, "Uspješno ste prijavljeni.");

  } catch (error) {

    showError(
      loginMessage,
      "Prijava nije uspjela: " + error.message
    );

  } finally {

    loginButton.disabled = false;
    loginButton.textContent = "Prijavi se";

  }

});

// ==================================================
// RESET LOZINKE
// ==================================================

document.getElementById("resetButton").addEventListener(
  "click",
  async function() {

    const email = document.getElementById("email").value.trim();

    if (!email) {
      showError(
        loginMessage,
        "Prvo unesite svoju email adresu."
      );
      return;
    }

    try {

      const { error } = await supabase.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: window.location.origin
        }
      );

      if (error) throw error;

      showSuccess(
        loginMessage,
        "Ako je email registrovan, dobit ćete poruku za promjenu lozinke."
      );

    } catch (error) {

      showError(loginMessage, error.message);

    }

  }
);

// ==================================================
// PREGLED PONUDE
// ==================================================

document.getElementById("previewButton").addEventListener(
  "click",
  function() {

    const primalac =
      document.getElementById("primalac").value.trim();

    const subject =
      document.getElementById("subject").value.trim();

    const tekst =
      document.getElementById("tekst").value.trim();

    if (!primalac || !subject || !tekst) {
      showError(
        status,
        "Popunite primaoca, naslov i tekst ponude."
      );
      return;
    }

    alert(
      "PREGLED POSLOVNE PONUDE\n\n" +
      "Primalac: " + primalac + "\n\n" +
      "Naslov: " + subject + "\n\n" +
      "Tekst:\n" + tekst
    );

  }
);

// ==================================================
// SLANJE EMAILA PREKO SUPABASE EDGE FUNCTION
// ==================================================

offerForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  clearMessage(status);

  const primalac =
    document.getElementById("primalac").value.trim();

  const senderName = senderInput.value.trim();

  const subject =
    document.getElementById("subject").value.trim();

  const tekst =
    document.getElementById("tekst").value.trim();

  if (!primalac || !senderName || !subject || !tekst) {
    showError(status, "Molimo popunite sva polja.");
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(primalac)) {
    showError(status, "Email adresa primaoca nije ispravna.");
    return;
  }

  if (
    FUNCTION_NAME === "UNESI_NAZIV_EDGE_FUNCTION" ||
    !FUNCTION_NAME.trim()
  ) {
    showError(
      status,
      "Nije podešen naziv Supabase Edge Function."
    );
    return;
  }

  if (
    SENDER_DOMAIN === "UNESI_SVOJU_DOMENU.BA" ||
    !SENDER_DOMAIN.trim()
  ) {
    showError(
      status,
      "Nije podešena domena pošiljaoca."
    );
    return;
  }

  const posiljalac =
    senderName + " <ponude@" + SENDER_DOMAIN + ">";

  const potvrda = confirm(
    "Da li ste sigurni da želite poslati ovu ponudu?\n\n" +
    "Primalac: " + primalac + "\n" +
    "Pošiljalac: " + posiljalac + "\n" +
    "Naslov: " + subject
  );

  if (!potvrda) return;

  sendButton.disabled = true;
  sendButton.textContent = "Slanje u toku...";

  try {

    // Supabase SDK automatski dodaje API ključ
    // i token aktivne sesije u zahtjev.

    const { data, error } = await supabase.functions.invoke(
      FUNCTION_NAME,
      {
        body: {
          action: "POSALJI",
          primalac,
          posiljalac,
          subject,
          tekst
        }
      }
    );

    if (error) {
      throw error;
    }

    if (!data || data.success !== true) {
      throw new Error(
        data?.message ||
        "Server nije potvrdio uspješno slanje emaila."
      );
    }

    showSuccess(
      status,
      "Poslovna ponuda je uspješno poslana na: " +
      (data.primalac || primalac)
    );

    offerForm.reset();
    senderInput.value = "DOCBIZHUB";

  } catch (error) {

    console.error("Greška pri slanju:", error);

    showError(
      status,
      "Slanje nije uspjelo.\n\n" +
      (error.message || "Nepoznata greška.")
    );

  } finally {

    sendButton.disabled = false;
    sendButton.textContent = "Pošalji poslovnu ponudu";

  }

});

// ==================================================
// ODJAVA
// ==================================================

document.getElementById("logoutButton").addEventListener(
  "click",
  async function() {

    try {

      const { data, error: sessionError } =
        await supabase.auth.getSession();

      if (sessionError) throw sessionError;

      if (data.session) {
        await updateUserStatus(data.session.user, false);
      }

      const { error } = await supabase.auth.signOut();

      if (error) throw error;

      showLogin();

      clearMessage(loginMessage);
      clearMessage(status);

    } catch (error) {

      showError(
        status,
        "Greška pri odjavi: " + error.message
      );

    }

  }
);

// ==================================================
// PRAĆENJE SESIJE
// ==================================================

supabase.auth.onAuthStateChange(function(event, session) {

  if (session && session.user) {
    showAdmin(session.user);
  } else {
    showLogin();
  }

});

// ==================================================
// PROVJERA POSTOJEĆE SESIJE
// ==================================================

async function initialize() {

  console.log("DOCBIZHUB: Pokretanje stranice.");

  try {

    const { data, error } = await supabase.auth.getSession();

    if (error) throw error;

    if (data.session && data.session.user) {
      showAdmin(data.session.user);
    } else {
      showLogin();
    }

  } catch (error) {

    console.error("INITIALIZE ERROR:", error);

    showLogin();

    showError(
      loginMessage,
      "Greška pri povezivanju: " + error.message
    );

  }

}

initialize();

</script>

</body>
</html>
