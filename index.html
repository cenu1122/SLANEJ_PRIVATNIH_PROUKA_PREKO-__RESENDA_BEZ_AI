
<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slanje emaila firmama</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  font-family: Arial, sans-serif;
  background: #f3f5f9;
}

.container {
  max-width: 650px;
  margin: 30px auto;
  padding: 28px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
  color: #172b4d;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
  color: #344054;
}

input, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d0d5dd;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

input:focus, textarea:focus {
  border-color: #2563eb;
}

textarea {
  min-height: 220px;
  resize: vertical;
  line-height: 1.6;
}

button {
  width: 100%;
  margin-top: 23px;
  padding: 15px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#status {
  display: none;
  margin-top: 18px;
  padding: 13px;
  border-radius: 8px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.success {
  display: block !important;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block !important;
  background: #fee2e2;
  color: #991b1b;
}
</style>
</head>

<body>

<div class="container">

<h2>Slanje emaila firmama</h2>

<p>
Unesi podatke koje želiš poslati.
Email će biti poslan tačno onako kako ga napišeš.
</p>

<form id="emailForm">

<label>Email primaoca (firma)</label>
<input
  type="email"
  id="primalac"
  placeholder="firma@example.com"
  required
>

<label>Email pošiljaoca</label>
<input
  type="email"
  id="posiljalac"
  placeholder="tvoj@email.com"
  required
>

<label>Naslov emaila</label>
<input
  type="text"
  id="subject"
  placeholder="Poslovna ponuda"
  required
>

<label>Tekst emaila</label>
<textarea
  id="tekst"
  placeholder="Napiši tačno šta želiš poslati firmi..."
  required
></textarea>

<button type="submit" id="sendButton">
POŠALJI EMAIL FIRMI
</button>

</form>

<div id="status"></div>

</div>

<script type="module">

// SUPABASE PODACI

const SUPABASE_URL =
  'https://uduwpvdjmanrgpumdrfh.supabase.co';

const SUPABASE_ANON_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InVkdXdwdmRqbWFucmdwdW1kcmZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTEwODQsImV4cCI6MjEwMDM4NzA4NH0.zdxIxiCJcaauEP1pm75d1-4YXO1Dn6tsAhZehFh2vsQ';

// NAZIV EDGE FUNKCIJE

const FUNCTION_NAME =
  "SALJI_MAIL_FIRMAMA_BEZ_AI_GENERISANJA_PORUKA";

// SUPABASE CLIENT

import { createClient } from
"https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const form = document.getElementById("emailForm");
const button = document.getElementById("sendButton");
const status = document.getElementById("status");

const posiljalacInput =
  document.getElementById("posiljalac");

// AUTOMATSKO UČITAVANJE EMAIL ADRESE

const SACUVANI_EMAIL_KEY = "docbizhub_posiljalac_email";

const sacuvaniEmail =
  localStorage.getItem(SACUVANI_EMAIL_KEY);

if (sacuvaniEmail) {
  posiljalacInput.value = sacuvaniEmail;
}

// AUTOMATSKO ČUVANJE EMAIL ADRESE

posiljalacInput.addEventListener("input", () => {
  localStorage.setItem(
    SACUVANI_EMAIL_KEY,
    posiljalacInput.value.trim()
  );
});

// SLANJE EMAILA

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  status.className = "";
  status.style.display = "none";

  const primalac =
    document.getElementById("primalac").value.trim();

  const posiljalac =
    posiljalacInput.value.trim();

  const subject =
    document.getElementById("subject").value.trim();

  const tekst =
    document.getElementById("tekst").value.trim();

  if (!primalac || !posiljalac || !subject || !tekst) {
    status.className = "error";
    status.textContent = "Popuni sva polja.";
    return;
  }

  // SAČUVAJ EMAIL POŠILJAOCA

  localStorage.setItem(
    SACUVANI_EMAIL_KEY,
    posiljalac
  );

  button.disabled = true;
  button.textContent = "SLANJE U TOKU...";

  try {

    // POZIV EDGE FUNKCIJE BEZ PROVJERE PRIJAVE

    const { data, error } =
      await supabase.functions.invoke(
        FUNCTION_NAME,
        {
          body: {
            action: "POSALJI",
            primalac: primalac,
            posiljalac: posiljalac,
            subject: subject,
            tekst: tekst
          }
        }
      );

    if (error) {
      throw new Error(
        data?.error ||
        error.message ||
        "Greška prilikom slanja."
      );
    }

    if (!data?.success) {
      throw new Error(
        data?.error || "Email nije poslan."
      );
    }

    status.className = "success";

    status.textContent =
      "Email je uspješno poslan firmi: " +
      data.primalac;

    // OČISTI POLJA OSIM EMAIL ADRESE

    document.getElementById("primalac").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("tekst").value = "";

  } catch (error) {

    status.className = "error";

    status.textContent =
      error.message || "Došlo je do greške.";

  } finally {

    button.disabled = false;
    button.textContent = "POŠALJI EMAIL FIRMI";

  }

});

</script>

</body>
</html>
